name: verify-frontier

on:
  push:
    paths:
      - 'protocol/**'
      - 'frontier/**'
      - 'conversations/**'
      - 'lineage/**'
      - 'registry/**'
      - 'tests/**'
      - '.github/workflows/verify-frontier.yml'
  pull_request:
    paths:
      - 'protocol/**'
      - 'frontier/**'
      - 'conversations/**'
      - 'lineage/**'
      - 'registry/**'
      - 'tests/**'
      - '.github/workflows/verify-frontier.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m compileall -q frontier tests
      - name: Verify frontier
        run: python tests/verify_frontier_v0_3.py
      - name: Mutation campaign
        run: python tests/mutation_frontier_v0_3.py
